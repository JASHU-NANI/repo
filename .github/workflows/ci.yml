name: CI

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Compile Java"
        run: |
          javac Hello.java

  ai-analysis:
    needs: [ci]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Run AI DevOps Agent
        uses: JASHU-NANI/AI-DevOps-Agent@main
        with:
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}