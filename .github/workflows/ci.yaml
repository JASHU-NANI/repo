name: GitHub Actions Failure Demo

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run a successful step
        run: echo "This step passes perfectly."

      # This step will intentionally break your workflow
      - name: Force an intentional failure
        run: |
          echo "Simulating a broken test or deployment failure..."
          exit 1
